name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit and integration tests
        run: pytest tests/unit tests/integration -q
        env:
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          TAVILY_API_KEY: "tvly-ci-placeholder"
