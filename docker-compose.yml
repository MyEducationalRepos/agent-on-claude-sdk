services:
  agent:
    build: .
    env_file:
      - .env
    volumes:
      - runs:/app/runs
    profiles: []

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_runs
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_runs"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - metadata

volumes:
  runs:
  pgdata:
